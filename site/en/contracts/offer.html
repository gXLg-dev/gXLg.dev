<div class="heading">Offer</div>
<div class="text">
  <div class="title" null-data="(r, s, d) => d.name"></div>
  <div>
    Contract ID: <span class="keyword" null-data="(r, s, d) => d.id"></span><br>
    Language: <span class="keyword" null-data="(r, s, d) => d.lang"></span><br>
    Payment: Handled by Stripe<br>
    Development Fee: <span null-data="(r, s, d) => (d.dev / 100).toFixed(2)"></span>€<br>
    Hosting Price: <span null-data="(r, s, d) => (d.host / 100).toFixed(2)"></span>€ / month<br>
    Start Date: Immediately after conclusion<br>
    End Date: <span null-data="(r, s, d) => d.host == 0 ? 'Not applicable for a one-time payment' : 'Cancellable any time'"></span>
    <br><br>
    <form class="f" action="/api/contracts/accept" null-api="$./lib/contracts/accept.js">
      <label class="inline">
        <input class="inp" type="checkbox" name="terms">
        I confirm that I have read and understood the
        <a class="link" null-attr="(r, s, d) => ({ 'href': '/static/legal/terms/' + d.terms + '/en.pdf' })" null-data="(r, s, d) => 'Terms and Conditions (' + d.terms + ')'"></a>
        applicable to this contract
      </label>
      <label class="inline">
        <input class="inp" type="checkbox" name="cancellation">
        I confirm that I have read and understood the
        <a class="link" href="/static/legal/cancel/en.pdf">Cancellation Policy</a>.
      </label>
      <label class="inline">
        <input class="inp" type="checkbox" name="withdrawal">
        I expressly request that the provider begins performing
        the services before the cancellation period expires.
        I acknowledge that I lose my right of cancellation once
        the service has been fully performed.
      </label>
      <input type="hidden" name="id" null-attr="(r, s, d) => ({ 'value': d.id })">

      <input class="but" type="submit" value="Continue to payment (stripe.com)">

      <div class="error" null-data="^accept-error"></div>
    </form>
  </div>
</div>
