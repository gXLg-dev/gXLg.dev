<div class="heading">Angebot</div>
<div class="text">
  <div class="title" null-data="(r, s, d) => d.name"></div>
  <div>
    Vertrag ID: <span class="keyword" null-data="(r, s, d) => d.id"></span><br>
    Sprache: <span class="keyword" null-data="(r, s, d) => d.lang"></span><br>
    Zahlung: Von Stripe verwaltet<br>
    Entwicklung Kosten: <span null-data="(r, s, d) => (d.dev / 100).toFixed(2)"></span>€<br>
    Hosting Preis: <span null-data="(r, s, d) => (d.host / 100).toFixed(2)"></span>€ / Monat<br>
    Startdatum: Sofort nach dem Abschluss<br>
    Enddatum: <span null-data="(r, s, d) => d.host == 0 ? 'Nicht anwendbar auf Einmalzahlungen' : 'Jederzeit kündigbar'"></span>
    <br><br>
    <form class="f" action="/api/contracts/accept" null-api>
      <label class="inline">
        <input class="inp" type="checkbox" name="terms">
        Ich bestätige, dass ich die für diesen Vertrag geltende
        <a class="link" null-attr="(r, s, d) => ({ 'href': '/static/legal/terms/' + d.terms + '/' + d.lang + '.pdf' })" null-data="(r, s, d) => 'AGB (' + d.terms + ')'"></a>
        gelesen und verstanden habe.
      </label>
      <label class="inline">
        <input class="inp" type="checkbox" name="cancellation">
        Ich bestätige, dass ich die
        <a class="link" href="/static/legal/cancel/de.pdf">Widerrufsbelehrung</a>
        gelesen und verstanden habe.
      </label>
      <label class="inline">
        <input class="inp" type="checkbox" name="withdrawal">
        Ich verlange ausdrücklich und stimme zu, dass der Anbieter
        vor Ablauf der gesetzlichen Widerrufsfrist mit der Ausführung
        der beauftragten Dienstleistung beginnt. Mir ist bekannt,
        dass ich mein Widerrufsrecht verliere, sobald die Dienstleistung
        vollständig erbracht wurde.
      </label>
      <input type="hidden" name="id" null-attr="(r, s, d) => ({ 'value': d.id })">

      <input class="but" type="submit" value="Mit Zahlung fortfahren (stripe.com)">

      <div class="error" null-data="^accept-error"></div>
    </form>
    <div null-data="^cancel-success"></div>
    <form class="f" action="/api/contracts/cancel" null-api>
      <input type="hidden" name="id" null-attr="(r, s, d) => ({ 'value': d.id })">
      <label class="inline">
        <input class="inp" name="agree" type="checkbox">
        Ich bestätige, dass ich das Angebot ablehne und den Vertrag kündigen möchte.
        Nach der Kündigung wird dieses Angebot unwiderruflich gelöscht.
      </label>
      <input class="but" type="submit" value="Angebot ablehnen">
      <div class="error" null-data="^cancel-error"></div>
    </form>
  </div>
</div>
